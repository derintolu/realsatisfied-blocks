name: Deploy to WPMU DEV Studio21 Hosting

# Deploy to WPMU DEV hosting using rsync as recommended in their documentation
# https://wpmudev.com/docs/api-plugin-development/hosting-api-docs/#github
#
# Required GitHub Secrets:
# - SSH_HOST: Your WPMU DEV host (e.g., studio21.tempurl.host)
# - SSH_USERNAME: SSH username created in WPMU DEV Hub (e.g., c21mas-sftp)
# - SSH_PRIVATE_KEY: Private SSH key (generate with: ssh-keygen -t ed25519)
#
# Optional GitHub Secrets:
# - SSH_KNOWN_HOSTS: Host fingerprint for security (get with: ssh-keyscan -H studio21.tempurl.host)
# - WORDPRESS_PATH: Path to WordPress root (defaults to 'site' for WPMU DEV)
# - SSH_PORT: Custom SSH port (defaults to 22)
#
# Setup Steps:
# 1. Generate SSH key pair: ssh-keygen -t ed25519 -f ~/.ssh/realsatisfied_deploy
# 2. Add public key to WPMU DEV Hub > Your Site > Hosting > SSH/SFTP
# 3. Add private key to GitHub repo > Settings > Secrets > SSH_PRIVATE_KEY
# 4. Add other required secrets

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  test:
    name: Code Quality & Tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.1'
        extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite
        coverage: none

    - name: Cache Composer packages
      id: composer-cache
      uses: actions/cache@v3
      with:
        path: vendor
        key: ${{ runner.os }}-php-${{ hashFiles('**/composer.lock') }}
        restore-keys: |
          ${{ runner.os }}-php-

    - name: Install dependencies
      run: composer install --prefer-dist --no-progress --no-interaction

    - name: Setup PHPCS standards
      run: composer run-script install-standards

    - name: Run WordPress Coding Standards
      run: |
        echo "Running WordPress Coding Standards checks..."
        vendor/bin/phpcs --standard=phpcs-deploy.xml --report=summary --runtime-set ignore_warnings_on_exit 1
        echo "PHPCS checks passed ✅"

    - name: Check for security issues
      run: |
        echo "Checking for common security issues..."
        # Check for eval() usage (should never be used)
        if grep -r "eval(" --include="*.php" --exclude-dir=vendor --exclude-dir=node_modules .; then
          echo "❌ Found eval() usage - this is a security risk"
          exit 1
        fi

        # Check for direct $_GET output without escaping (more precise check)
        if grep -r "echo.*\$_GET\[" --include="*.php" --exclude-dir=vendor --exclude-dir=node_modules . | grep -v "esc_\|sanitize"; then
          echo "❌ Found unescaped \$_GET output"
          exit 1
        fi

        # Check for direct $_POST output without escaping (more precise check)
        if grep -r "echo.*\$_POST\[" --include="*.php" --exclude-dir=vendor --exclude-dir=node_modules . | grep -v "esc_\|sanitize"; then
          echo "❌ Found unescaped \$_POST output"
          exit 1
        fi

        echo "✅ Security checks passed"

  deploy:
    name: Deploy to Production Server
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # Note: Node.js build steps removed as production server doesn't have Node.js
    # All necessary built files should be committed to the repository

    # Package creation removed - rsync will handle exclusions directly

    - name: Setup SSH
      run: |
        # Create SSH directory
        mkdir -p ~/.ssh

        # Add SSH private key
        echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
        chmod 600 ~/.ssh/deploy_key

        # Add known hosts
        if [ -n "${{ secrets.SSH_KNOWN_HOSTS }}" ]; then
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" >> ~/.ssh/known_hosts
        else
          # Auto-accept host key (less secure but works if known_hosts not set)
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true
        fi

    - name: Deploy to WPMU DEV Hosting via rsync
      run: |
        echo "🚀 Starting deployment to WPMU DEV Studio21..."

        # First, let's explore the directory structure
        echo "🔍 Exploring server directory structure..."
        ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
          ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} << 'ENDSSH'
          echo "Current directory: $(pwd)"
          echo "Listing directories:"
          ls -la
          echo "Looking for WordPress structure:"
          find . -maxdepth 3 -name "wp-content" -type d 2>/dev/null || echo "wp-content not found in first 3 levels"
          find . -maxdepth 3 -name "wp-config.php" -type f 2>/dev/null || echo "wp-config.php not found in first 3 levels"
        ENDSSH

        # Set target path - WordPress is at site/public_html for WPMU DEV
        if [ -n "${{ secrets.WORDPRESS_PATH }}" ]; then
          BASE_PATH="${{ secrets.WORDPRESS_PATH }}"
        else
          BASE_PATH="site/public_html"
        fi

        echo "📁 Creating directory structure if needed..."
        ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
          ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} \
          "mkdir -p ${BASE_PATH}/wp-content/plugins/realsatisfied-blocks"

        TARGET_PATH="${BASE_PATH}/wp-content/plugins/realsatisfied-blocks/"
        echo "📁 Deploying to: $TARGET_PATH"

        # Deploy using rsync (as recommended by WPMU DEV)
        rsync -avz --delete \
          --exclude='.git*' \
          --exclude='node_modules' \
          --exclude='vendor' \
          --exclude='tests' \
          --exclude='phpcs*.xml' \
          --exclude='composer.*' \
          --exclude='package*.json' \
          --exclude='webpack.config.js' \
          --exclude='.github' \
          --exclude='logs' \
          --exclude='*.md' \
          --exclude='.env*' \
          -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
          ./ ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}:$TARGET_PATH

        echo "✅ Files synchronized successfully"

    - name: Clear cache and verify deployment
      run: |
        echo "🔄 Clearing WPMU DEV cache and verifying deployment..."

        # Use SSH to verify deployment and optionally clear cache
        ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
          ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} << 'ENDSSH'
          # Navigate to plugin directory - WordPress is at site/public_html
          if [ -n "${{ secrets.WORDPRESS_PATH }}" ]; then
            PLUGIN_DIR="${{ secrets.WORDPRESS_PATH }}/wp-content/plugins/realsatisfied-blocks"
          else
            PLUGIN_DIR="site/public_html/wp-content/plugins/realsatisfied-blocks"
          fi

          # Check if plugin file exists
          if [ -f "$PLUGIN_DIR/realsatisfied-blocks.php" ]; then
            echo "✅ Plugin deployed successfully"

            # Extract version
            VERSION=$(grep "Version:" "$PLUGIN_DIR/realsatisfied-blocks.php" | head -1 | sed 's/.*Version: *//')
            echo "📊 Deployed version: $VERSION"

            # Set proper permissions
            find "$PLUGIN_DIR" -type f -exec chmod 644 {} \; 2>/dev/null || true
            find "$PLUGIN_DIR" -type d -exec chmod 755 {} \; 2>/dev/null || true

            # Clear WordPress cache if WP-CLI is available
            if command -v wp &> /dev/null; then
              wp cache flush 2>/dev/null && echo "✅ WordPress cache cleared" || echo "ℹ️ Could not clear cache"
            fi
          else
            echo "❌ Plugin file not found at expected location"
            exit 1
          fi
        ENDSSH

        echo "🎉 Deployment completed successfully!"

    # Verification is now included in the deployment step above

    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v1
      with:
        files: realsatisfied-blocks-*.zip
        generate_release_notes: true
        body: |
          ## 🚀 RealSatisfied Blocks ${{ github.ref_name }}

          This release has been automatically deployed to production.

          ### Deployment Details
          - **Environment**: Production Server
          - **Deployed**: ${{ github.event.head_commit.timestamp }}
          - **Commit**: ${{ github.sha }}

          ### Changes
          ${{ github.event.head_commit.message }}

          ### Files Deployed
          - All plugin files
          - WordPress coding standards compliant
          - Security tested
          - PHP 7.4+ compatible

    - name: Notify deployment success
      if: success()
      run: |
        echo "🎉 Deployment completed successfully!"
        echo ""
        echo "📋 Deployment Summary:"
        echo "  - Environment: Production Server"
        echo "  - Host: ${{ secrets.SSH_HOST }}"
        echo "  - Version: ${{ github.ref_name }}"
        echo "  - Commit: ${{ github.sha }}"
        echo "  - Timestamp: $(date)"
        echo ""
        echo "✅ Plugin deployed to: ${{ secrets.WORDPRESS_PATH }}/wp-content/plugins/realsatisfied-blocks/"
        echo "✅ Backup created with timestamp"
        echo "✅ File permissions set correctly"
        echo "✅ Deployment verification passed"

    - name: Notify deployment failure
      if: failure()
      run: |
        echo "❌ Deployment failed!"
        echo ""
        echo "🔍 Troubleshooting steps:"
        echo "  1. Check SSH connection and credentials"
        echo "  2. Verify WordPress path is correct"
        echo "  3. Ensure server has sufficient disk space"
        echo "  4. Check file permissions on target directory"
        echo "  5. Review deployment logs above for specific errors"
        echo ""
        echo "📞 If issues persist, check server logs or contact hosting provider"
        exit 1